<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barista Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #temporizador { font-size: 3rem; margin: 20px 0; }
        button { padding: 15px 30px; font-size: 1.2rem; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Mi Café</h1>
    
    <div id="temporizador">00:00</div>
    
    <div id="info-molienda" style="margin: 15px 0; font-weight: bold; color: #555;">
        Selecciona un método para ver la molienda.
    </div>

    <label for="metodo">Elige tu cafetera:</label>
    <br>
    <select id="metodo" style="padding: 10px; margin-top: 10px;">
        <option value="180">V60 (3 min)</option>
        <option value="240">Prensa Francesa (4 min)</option>
        <option value="90">AeroPress (1.5 min)</option>
    </select>
    
    <br>
    <button onclick="iniciarTemporizador()">Iniciar Infusión</button>

    <script src="app.js"></script>
</body>
</html>
