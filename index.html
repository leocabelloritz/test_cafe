<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barista Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #temporizador { font-size: 3rem; margin: 20px 0; }
        button { padding: 15px 30px; font-size: 1.2rem; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Mi Café</h1>
    
    <div id="temporizador">00:00</div>
    
    <div id="info-molienda" style="margin: 15px 0; font-weight: bold; color: #555;">
        Selecciona un método para ver la molienda.
    </div>

    <label for="metodo">Elige tu cafetera:</label>
    <label for="molino">Tipo de molino:</label>
<select id="molino">
    <option value="manual">Manual (10-11)</option>
    <option value="electrico">Eléctrico (30-35)</option>
</select>

<label for="ratio">Intensidad (Ratio):</label>
<select id="ratio">
    <option value="16">Suave (1:16)</option>
    <option value="14">Cargado (1:14)</option>
    <option value="12">Muy fuerte (1:12)</option>
    <option value="10">Concentrado (1:10)</option>
</select>

<label for="gramos">Gramos de café:</label>
<input type="number" id="gramos" value="20" onchange="calcularAgua()">

<div id="resultado-agua" style="font-size: 1.2rem; margin: 10px 0; color: #d35400;">
    Agua necesaria: 320ml
</div>

    <br>
    <select id="metodo" style="padding: 10px; margin-top: 10px;">
        <option value="180">V60 (3 min)</option>
        <option value="240">Prensa Francesa (4 min)</option>
        <option value="90">AeroPress (1.5 min)</option>
    </select>
    
    <br>
    <button onclick="iniciarTemporizador()">Iniciar Infusión</button>

    <script src="app.js"></script>
</body>
</html>
