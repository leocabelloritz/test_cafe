<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barista Umbra</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
<script>
  // Inicializar vConsole
  var vConsole = new window.VConsole();

</script>

</head>
<body>
    <button id="btn-menu" onclick="toggleMenu()">☰</button>
    
    <h1>UMBRA</h1>
    <div id="temporizador">00:00</div>

<nav id="menu-lateral" class="menu-cerrado">
<div id="overlay" onclick="toggleMenu()"></div>
    <ul>
        <li><a href="#" onclick="abrirSeccion('temporizador')">Temporizador</a></li>
        <li><a href="#" onclick="abrirSeccion('recetas')">Recetas</a></li>
        <li><a href="#" onclick="abrirSeccion('tipos-cafe')">Tipos de Café</a></li>
        <li><a href="#" onclick="abrirSeccion('bitacora')">Bitácora</a></li>
        <li><a href="#" onclick="abrirSeccion('glosario')">Glosario</a></li>
        <li><a href="#" onclick="abrirSeccion('ajustes')">Ajustes</a></li>
    </ul>
</nav>

    <label for="metodo">Elige tu método:</label><br>
    
    <div class="espacio"></div>⁠
    
    <select id="metodo" onchange="mostrarOpciones()">
        <option value="v60">V60</option>
        <option value="francesa">Prensa Francesa</option>
        <option value="aeropress">AeroPress</option>
        <option value="moka">Cafetera Moka</option>
        <option value="te-verde">Té Verde</option>
    </select>

    <div id="opciones-francesa" class="opciones-extra" style="display: none;">
        <label>Tipo de molino:</label><br>
        
        <div class="espacio"></div>
        ⁠
        <select id="molino" onchange="actualizarMolienda()">
            <option value="manual">Manual (10-11)</option>
            <option value="electrico">Eléctrico (30-35)</option>
        </select>
        
        <br><br><label>Intensidad (Ratio):</label><br>
        
        <div class="espacio"></div>⁠
        
        <select id="ratio" onchange="calcularAgua()">
            <option value="16">Suave (1:16)</option>
            <option value="14">Cargado (1:14)</option>
            <option value="12">Muy fuerte (1:12)</option>
            <option value="10">Concentrado (1:10)</option>
        </select>
        
        <br><br><label>Gramos de café:</label><br>
        
        <div class="espacio"></div>⁠
        
        <input type="number" id="gramos" value="20" onchange="calcularAgua()">
        
        <div class="espacio"></div>⁠
        
        <div id="resultado-agua">Agua necesaria: 320ml</div>
    </div>
    
    <br>
    <button id="btn-iniciar" onclick="iniciarTemporizador()">Iniciar Infusión</button>

    <!-- Scripts al final -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
